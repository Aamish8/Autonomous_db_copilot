spring.application.name=db-copilot
spring.datasource.url=jdbc:postgresql://localhost:5432/copilot-db
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
copilot.target.url=jdbc:postgresql://localhost:5432/sales_dw
copilot.target.username=copilot_ro
copilot.target.password=copilot_ro
spring.jpa.hibernate.ddl-auto=update
copilot.crypto.password=${COPILOT_CRYPTO_PASSWORD:dev-only-change-me-please}
copilot.crypto.salt=${COPILOT_CRYPTO_SALT:050c54a9e58382f1}
spring.security.user.name=demo
spring.security.user.password=${DEMO_PASSWORD:change-me}